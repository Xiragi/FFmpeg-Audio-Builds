name: Test Audio Builds
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

env:
  DOCKER_BUILDKIT: 1

jobs:
  build:
    name: Test Audio Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win64, winarm64, linux64, linuxarm64]
        variant: [lgpl-audio, lgpl-audio-shared]
        quickbuild: [1]
        include:
          - target: win64
            variant: lgpl-audio
            quickbuild: ''
          - target: linux64
            variant: lgpl-audio-shared
            quickbuild: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
          driver: docker
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Build Image
        run: ./makeimage.sh ${{ matrix.target }} ${{ matrix.variant }}
        env:
          QUICKBUILD: ${{ matrix.quickbuild }}
      - name: Build ffmpeg
        run: ./build.sh ${{ matrix.target }} ${{ matrix.variant }}
      - name: Replace spaces in string
        id: strs
        run: |
          SLUG="${{ matrix.target }}-${{ matrix.variant }}${{ matrix.quickbuild == '' && '-full' || '' }}"
          echo "artifact_slug=${SLUG// /-}" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.strs.outputs.artifact_slug }}
          overwrite: true
          path: artifacts/*

  build_macos:
    name: Test macOS Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
        variant: [lgpl-audio]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install native build tools
        run: |
          brew install bash coreutils gnu-sed make bison texinfo gettext autoconf automake libtool cmake nasm subversion pkgconf
      - name: Build and audit macOS artifacts
        run: '"$(brew --prefix bash)/bin/bash" util/build_macos.sh'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-macos-${{ matrix.os }}-${{ matrix.variant }}
          overwrite: true
          path: artifacts/*
